permissions:
  contents: read

concurrency:
  group: android-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Build original English demo and test browser interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Android build packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Build the original demo and verify its assets
        run: |
          npm ci --no-audit --no-fund
          npm run prepare:demo
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/test-range-stream.py
          python3 tools/build-apk-ci.py --demo
          python3 tools/verify-native-apk.py dist/listenly-demo-test.apk --output .build/demo/native-apk.json
      - name: Test playback, folder import and responsive layouts
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:replay
          npm run test:experience
          npm run test:quiz
          npm run test:lens
          npm run test:home
          npm run test:glass
          npm run test:playback
          npm run test:wallpaper
          npm run test:import-media
          npm run test:speed
          npm run test:idle
          npm run test:theme
          npm run test:native-theme
          npm run test:library
          npm run test:paper
          npm run test:native-engine
      - name: Save the original demo test APK and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: listenly-original-demo-test-${{ github.run_attempt }}
          path: |
            dist/listenly-demo-test.apk
            dist/*-phone.png
            dist/home-desktop.png
            dist/reader-layout-results.json
            dist/ui-result.json
            .build/demo/build.json
            .build/demo/build.log
            .build/demo/native-apk.json
            .build/range-stream-tests/result.json
            .build/replay-browser/latest/result.json
            .build/theme-home-profile/
            .build/compact-quiz/
            .build/nav-lens/
            .build/home-player/
            .build/glass-system/browser/
            .build/playback-modes/
            .build/tahoe/wallpaper-flow/
            .build/import-media-browser/
            .build/speed-cycle/browser/
            .build/ui-idle/
            .build/theme-compositor/browser/
            .build/theme-native/browser/
            .build/library-accordion/
            .build/paper-playback/
            .build/native-engine-browser/
          include-hidden-files: true
          retention-days: 14

  runtime:
    name: Install, launch and interact on Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 36]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-13
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select one SDK directory for building and emulation
        shell: bash
        run: |
          task_sdk="$RUNNER_TEMP/listenly-android-sdk"
          mkdir -p "$task_sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$task_sdk" "$task_sdk" >> "$GITHUB_ENV"
      - name: Free the unused preinstalled SDK on this disposable runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          task_preinstalled_sdk='/usr/local/lib/android/sdk'
          task_active_sdk="$(realpath -m "$ANDROID_HOME")"
          test "$task_active_sdk" = "$(realpath -m "$RUNNER_TEMP/listenly-android-sdk")"
          if test -d "$task_preinstalled_sdk"; then
            test "$(realpath "$task_preinstalled_sdk")" = "$task_preinstalled_sdk"
            test "$task_active_sdk" != "$task_preinstalled_sdk"
            du -sh "$task_preinstalled_sdk"
            sudo rm -rf -- "$task_preinstalled_sdk"
          fi
          df -h "$RUNNER_TEMP"
      - name: Install SDK command-line tools and Android build packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4, verified 2026-10-13
        with:
          cmdline-tools-version: '14742923' # Google command-line tools 20.0; also used by emulator-runner
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Verify the shared SDK and tool paths
        shell: bash
        run: |
          test "$ANDROID_HOME" = "$ANDROID_SDK_ROOT"
          test "$(command -v sdkmanager)" = "$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager"
          test -x "$ANDROID_HOME/cmdline-tools/20.0/bin/avdmanager"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/d8.jar"
          mkdir -p .build/ci
          {
            printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT"
            command -v sdkmanager
            command -v avdmanager
            command -v adb
            sdkmanager --version
            adb version
          } | tee .build/ci/sdk-environment.log
      - name: Test source logic
        run: |
          npm test
          python3 tools/test-range-stream.py
      - name: Build the frontend for older Android WebView
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
      - name: Prepare original fixtures and build the APK
        run: |
          python3 tools/prepare-ci-assets.py
          python3 tools/build-apk-ci.py
          python3 tools/verify-native-apk.py dist/listenly-ci-fixture.apk --output .build/ci/native-apk.json
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          if test -e /dev/kvm; then sudo chmod 0666 /dev/kvm; fi
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercise the installed app and collect runtime evidence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, verified 2026-10-13
        with:
          api-level: ${{ matrix.api }}
          avd-name: Listenly_CI_API_${{ matrix.api }}
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          disk-size: 6144M
          disable-linux-hw-accel: false
          # Theme rendering must exercise the animated path, not Android's
          # animator-duration-scale=0 / prefers-reduced-motion shortcut.
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: |
            df -h "$ANDROID_HOME" "$ANDROID_AVD_HOME"
            test "$(df -Pk "$ANDROID_AVD_HOME" | awk 'NR==2 {print $4}')" -ge 8388608
          script: |
            node tools/android-native-smoke.mjs emulator-5554 dist/listenly-ci-fixture.apk api-${{ matrix.api }}-native --fixture
      - name: Save the APK and runtime evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: listenly-android-api-${{ matrix.api }}-${{ github.run_attempt }}
          path: |
            dist/listenly-ci-fixture.apk
            .build/ci/build.json
            .build/ci/build.log
            .build/ci/native-apk.json
            .build/ci/sdk-environment.log
            .build/runtime-results/api-${{ matrix.api }}-native/
            .build/range-stream-tests/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
