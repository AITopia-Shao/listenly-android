<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <meta name="color-scheme" content="light dark">
  <title>听力训练</title>
  <script>try{var preference=JSON.parse(localStorage.getItem('listenly.state.v1')||'{}');document.documentElement.setAttribute('data-theme',preference.theme==='dark'?'dark':'light')}catch(error){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <input id="folder-input" type="file" webkitdirectory directory multiple hidden>
  <audio id="audio" preload="metadata"></audio>
  <div id="toast" role="status" aria-live="polite"></div>
  <script defer src="app.compat.js"></script>
</body>
</html>
